<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Skycast — Weather</title>
<style>
/* ============================================================
   1. THEME TOKENS + BASE
   ============================================================ */
:root{
  --bg-a:#1b3b6f; --bg-b:#0b1f3a;
  --card:rgba(255,255,255,.12);
  --card-strong:rgba(255,255,255,.2);
  --stroke:rgba(255,255,255,.22);
  --fg:#f7fafc; --fg-dim:rgba(247,250,252,.72);
  --accent:#ffd166;
  --radius:18px;
  --shadow:0 18px 40px rgba(0,0,0,.28);
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  font-family:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  color:var(--fg);
  background:linear-gradient(160deg,var(--bg-a),var(--bg-b));
  background-attachment:fixed;
  transition:background 900ms ease;
  min-height:100%;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:1040px;margin:0 auto;padding:22px 16px 56px}
h1,h2,h3{margin:0;line-height:1.15}
button{font:inherit;color:inherit;cursor:pointer}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ============================================================
   2. HEADER / SEARCH
   ============================================================ */
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:20px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.5px;font-size:1.15rem}
.brand .dot{width:12px;height:12px;border-radius:50%;background:var(--accent);box-shadow:0 0 14px var(--accent)}
.tools{display:flex;gap:10px;flex:1 1 320px;min-width:260px;position:relative}
.search{flex:1;position:relative}
input[type=search]{
  width:100%;padding:13px 16px;border-radius:999px;border:1px solid var(--stroke);
  background:var(--card);color:var(--fg);font-size:1rem;outline:none;
  transition:background .25s,border-color .25s;
}
input[type=search]::placeholder{color:var(--fg-dim)}
input[type=search]:focus{border-color:var(--accent);background:var(--card-strong)}
.icon-btn{
  border:1px solid var(--stroke);background:var(--card);border-radius:999px;
  padding:0 16px;height:48px;display:inline-flex;align-items:center;gap:8px;
  transition:transform .15s,background .25s;white-space:nowrap;
}
.icon-btn:hover{background:var(--card-strong)}
.icon-btn:active{transform:scale(.96)}
.unit{font-weight:700}
.unit span{opacity:.5}
.unit span.on{opacity:1;color:var(--accent)}

/* autocomplete */
.suggest{
  position:absolute;top:56px;left:0;right:0;z-index:20;
  background:rgba(12,22,40,.96);border:1px solid var(--stroke);border-radius:14px;
  overflow:hidden;box-shadow:var(--shadow);display:none;
}
.suggest.open{display:block}
.suggest button{
  display:block;width:100%;text-align:left;padding:11px 14px;background:none;border:0;
  border-bottom:1px solid rgba(255,255,255,.08);font-size:.95rem;
}
.suggest button:last-child{border-bottom:0}
.suggest button:hover,.suggest button:focus{background:rgba(255,255,255,.12);outline:none}
.suggest small{display:block;color:var(--fg-dim)}

/* ============================================================
   3. CARDS / LAYOUT
   ============================================================ */
.card{
  background:var(--card);border:1px solid var(--stroke);border-radius:var(--radius);
  backdrop-filter:blur(10px);box-shadow:var(--shadow);padding:20px;margin-bottom:18px;
  animation:rise .45s ease both;
}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.status{text-align:center;padding:26px;font-size:1rem;color:var(--fg-dim)}
.status.error{color:#ffd0d0}
.spinner{
  width:30px;height:30px;margin:0 auto 12px;border-radius:50%;
  border:3px solid rgba(255,255,255,.25);border-top-color:var(--accent);
  animation:spin .8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
.hidden{display:none !important}

/* current */
.now{display:flex;flex-wrap:wrap;gap:20px;align-items:center;justify-content:space-between}
.now-main{display:flex;align-items:center;gap:16px}
.now-ico{font-size:4.2rem;line-height:1}
.temp{font-size:3.6rem;font-weight:700;letter-spacing:-2px}
.place{font-size:1.1rem;font-weight:600}
.meta{color:var(--fg-dim);font-size:.9rem;margin-top:2px}
.badge{
  display:inline-flex;align-items:center;gap:6px;margin-top:8px;padding:4px 10px;
  border-radius:999px;background:var(--card-strong);border:1px solid var(--stroke);font-size:.8rem;
}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin-top:18px}
.stat{background:var(--card-strong);border-radius:14px;padding:12px}
.stat b{display:block;font-size:1.05rem;margin-top:4px}
.stat span{font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:var(--fg-dim)}

/* hourly */
.strip{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 10px;scroll-snap-type:x proximity}
.strip::-webkit-scrollbar{height:8px}
.strip::-webkit-scrollbar-thumb{background:rgba(255,255,255,.28);border-radius:99px}
.hour{
  flex:0 0 78px;scroll-snap-align:start;text-align:center;padding:12px 6px;border-radius:14px;
  background:var(--card-strong);border:1px solid transparent;transition:transform .2s,border-color .2s;
}
.hour:hover{transform:translateY(-3px)}
.hour.current{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.hour .t{font-size:.78rem;color:var(--fg-dim)}
.hour .i{font-size:1.5rem;margin:6px 0}
.hour .d{font-weight:700}
.hour .p{font-size:.72rem;color:#9fd8ff;margin-top:4px}

/* daily */
.day{
  width:100%;display:grid;grid-template-columns:1.2fr auto 1fr auto;gap:12px;align-items:center;
  background:var(--card-strong);border:1px solid transparent;border-radius:14px;
  padding:12px 14px;margin-bottom:8px;text-align:left;transition:background .2s;
}
.day:hover{background:rgba(255,255,255,.26)}
.day[aria-expanded=true]{border-color:var(--accent)}
.day .name{font-weight:600}
.day .ico{font-size:1.5rem}
.day .hl{text-align:right;font-variant-numeric:tabular-nums}
.day .hl small{color:var(--fg-dim);margin-left:6px}
.day .pop{font-size:.78rem;color:#9fd8ff;min-width:44px;text-align:right}
.day-panel{overflow:hidden;max-height:0;transition:max-height .35s ease}
.day-panel.open{max-height:220px}
.day-panel .strip{margin:2px 0 12px}

footer{text-align:center;color:var(--fg-dim);font-size:.8rem;margin-top:10px}
@media (max-width:560px){
  .temp{font-size:3rem}.now-ico{font-size:3.4rem}
  .day{grid-template-columns:1fr auto auto;}
  .day .pop{display:none}
}
</style>
</head>
<body>
<div class="wrap">

  <!-- ===================== HTML STRUCTURE ===================== -->
  <header>
    <div class="brand"><span class="dot"></span> Skycast</div>
    <div class="tools">
      <div class="search">
        <label class="sr" for="q">Search city</label>
        <input id="q" type="search" placeholder="Search a city…" autocomplete="off" role="combobox" aria-expanded="false" aria-controls="suggest" />
        <div id="suggest" class="suggest" role="listbox"></div>
      </div>
      <button id="geo" class="icon-btn" title="Use my location">📍 <span class="sr">Use my location</span></button>
      <button id="unit" class="icon-btn unit" title="Toggle units"><span id="uC" class="on">°C</span>/<span id="uF">°F</span></button>
    </div>
  </header>

  <div id="status" class="card status hidden"></div>

  <main id="app" class="hidden">
    <!-- Current weather -->
    <section class="card" aria-labelledby="nowTitle">
      <h2 id="nowTitle" class="sr">Current weather</h2>
      <div class="now">
        <div class="now-main">
          <div id="nowIcon" class="now-ico">☀️</div>
          <div>
            <div id="nowTemp" class="temp">--°</div>
            <div id="nowCond" class="meta">—</div>
          </div>
        </div>
        <div style="text-align:right">
          <div id="place" class="place">—</div>
          <div id="localTime" class="meta">—</div>
          <div id="dayNight" class="badge">🌞 Day</div>
        </div>
      </div>
      <div class="stats">
        <div class="stat"><span>Feels like</span><b id="sFeel">—</b></div>
        <div class="stat"><span>Humidity</span><b id="sHum">—</b></div>
        <div class="stat"><span>Wind</span><b id="sWind">—</b></div>
        <div class="stat"><span>Precipitation</span><b id="sPrec">—</b></div>
        <div class="stat"><span>UV index</span><b id="sUv">—</b></div>
      </div>
    </section>

    <!-- Hourly -->
    <section class="card">
      <h3>Next 24 hours</h3>
      <div id="hourly" class="strip"></div>
    </section>

    <!-- Daily -->
    <section class="card">
      <h3>5-day forecast</h3>
      <div id="daily" style="margin-top:12px"></div>
    </section>
  </main>

  <footer>Data by Open-Meteo · times shown in the location's local time</footer>
</div>

<script>
/* ============================================================
   JS 1. CONSTANTS & WMO CODE MAP
   ============================================================ */
const GEO_URL = "https://geocoding-api.open-meteo.com/v1/search";
const FORECAST_URL = "https://api.open-meteo.com/v1/forecast";
const STORE_KEY = "skycast:last";
const UNIT_KEY = "skycast:unit";

// WMO weather code -> label, day icon, night icon, theme group
const WMO = {
  0:["Clear sky","☀️","🌙","clear"],
  1:["Mainly clear","🌤️","🌙","clear"],
  2:["Partly cloudy","⛅","☁️","cloud"],
  3:["Overcast","☁️","☁️","cloud"],
  45:["Fog","🌫️","🌫️","fog"],
  48:["Freezing fog","🌫️","🌫️","fog"],
  51:["Light drizzle","🌦️","🌧️","rain"],
  53:["Drizzle","🌦️","🌧️","rain"],
  55:["Heavy drizzle","🌧️","🌧️","rain"],
  56:["Freezing drizzle","🌧️","🌧️","rain"],
  57:["Freezing drizzle","🌧️","🌧️","rain"],
  61:["Light rain","🌦️","🌧️","rain"],
  63:["Rain","🌧️","🌧️","rain"],
  65:["Heavy rain","🌧️","🌧️","rain"],
  66:["Freezing rain","🌧️","🌧️","rain"],
  67:["Freezing rain","🌧️","🌧️","rain"],
  71:["Light snow","🌨️","🌨️","snow"],
  73:["Snow","❄️","❄️","snow"],
  75:["Heavy snow","❄️","❄️","snow"],
  77:["Snow grains","🌨️","🌨️","snow"],
  80:["Rain showers","🌦️","🌧️","rain"],
  81:["Rain showers","🌧️","🌧️","rain"],
  82:["Violent showers","⛈️","⛈️","storm"],
  85:["Snow showers","🌨️","🌨️","snow"],
  86:["Snow showers","❄️","❄️","snow"],
  95:["Thunderstorm","⛈️","⛈️","storm"],
  96:["Thunderstorm, hail","⛈️","⛈️","storm"],
  99:["Thunderstorm, hail","⛈️","⛈️","storm"]
};
function decode(code, isDay){
  const e = WMO[code] || ["Unknown","❔","❔","cloud"];
  return { label:e[0], icon: isDay ? e[1] : e[2], group:e[3] };
}

// Theme palettes per condition group + day/night
const THEMES = {
  clear:{day:["#4fa8e0","#0b5f9e"],night:["#1b2a4a","#070d1c"]},
  cloud:{day:["#7f93a8","#39506b"],night:["#2a3446","#10161f"]},
  rain:{day:["#4b6a8a","#233448"],night:["#1f2a3a","#0a1118"]},
  snow:{day:["#8fb8d8","#4a6785"],night:["#26364d","#0d141f"]},
  storm:{day:["#4a4560","#1c1a2b"],night:["#2a2440","#0c0a16"]},
  fog:{day:["#8e9aa4","#4c565f"],night:["#2b3238","#12161a"]}
};

/* ============================================================
   JS 2. STATE & HELPERS
   ============================================================ */
let unit = localStorage.getItem(UNIT_KEY) === "F" ? "F" : "C";
let data = null;      // last forecast payload
let place = null;     // {name, country, admin1, latitude, longitude}
let openDay = -1;

const $ = id => document.getElementById(id);
const statusEl = $("status"), appEl = $("app");

const toF = c => c * 9/5 + 32;
const t = c => (c == null ? "—" : Math.round(unit === "C" ? c : toF(c)) + "°");
function debounce(fn, ms){ let h; return (...a)=>{ clearTimeout(h); h = setTimeout(()=>fn(...a), ms); }; }

function showStatus(msg, isError){
  statusEl.className = "card status" + (isError ? " error" : "");
  statusEl.innerHTML = isError ? msg : '<div class="spinner"></div>' + msg;
  statusEl.classList.remove("hidden");
  if (isError || !data) appEl.classList.add("hidden");
}
function clearStatus(){ statusEl.classList.add("hidden"); appEl.classList.remove("hidden"); }

function applyTheme(group, isDay){
  const pal = (THEMES[group] || THEMES.cloud)[isDay ? "day" : "night"];
  document.body.style.background = `linear-gradient(160deg,${pal[0]},${pal[1]})`;
  document.body.style.backgroundAttachment = "fixed";
}

/* ============================================================
   JS 3. API CALLS
   ============================================================ */
async function geocode(name){
  const url = `${GEO_URL}?name=${encodeURIComponent(name)}&count=5&language=en&format=json`;
  const res = await fetch(url);
  if (!res.ok) throw new Error("Search failed. Please try again.");
  const json = await res.json();
  return json.results || [];
}

async function reverseName(lat, lon){
  // Open-Meteo has no reverse geocoding; show coordinates as a fallback label.
  return { name: `${lat.toFixed(2)}, ${lon.toFixed(2)}`, country:"Your location", latitude:lat, longitude:lon };
}

async function getForecast(lat, lon){
  const params = new URLSearchParams({
    latitude: lat, longitude: lon, timezone: "auto", forecast_days: "7",
    current: "temperature_2m,apparent_temperature,relative_humidity_2m,precipitation,weather_code,wind_speed_10m,is_day,uv_index",
    hourly: "temperature_2m,weather_code,precipitation_probability,is_day",
    daily: "weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max"
  });
  const res = await fetch(`${FORECAST_URL}?${params}`);
  if (!res.ok) throw new Error("Weather service is unavailable right now.");
  return res.json();
}

/* ============================================================
   JS 4. LOAD ORCHESTRATION
   ============================================================ */
async function load(p){
  place = p;
  showStatus(`Loading weather for ${p.name}…`);
  try{
    data = await getForecast(p.latitude, p.longitude);
    localStorage.setItem(STORE_KEY, JSON.stringify(p));
    openDay = -1;
    render();
    clearStatus();
  }catch(err){
    const offline = !navigator.onLine;
    showStatus(offline ? "You appear to be offline. Check your connection and try again."
                       : (err.message || "Something went wrong."), true);
  }
}

/* ============================================================
   JS 5. RENDERING
   ============================================================ */
function render(){
  const c = data.current, u = data.current_units;
  const isDay = c.is_day === 1;
  const cond = decode(c.weather_code, isDay);

  $("nowIcon").textContent = cond.icon;
  $("nowTemp").textContent = t(c.temperature_2m);
  $("nowCond").textContent = cond.label;
  $("place").textContent = [place.name, place.admin1, place.country].filter(Boolean).join(", ");
  $("localTime").textContent = new Date(c.time).toLocaleString(undefined,{weekday:"long",hour:"2-digit",minute:"2-digit"});
  $("dayNight").textContent = isDay ? "🌞 Day" : "🌜 Night";

  $("sFeel").textContent = t(c.apparent_temperature);
  $("sHum").textContent = (c.relative_humidity_2m ?? "—") + "%";
  $("sWind").textContent = Math.round(c.wind_speed_10m) + " " + (u.wind_speed_10m || "km/h");
  $("sPrec").textContent = (c.precipitation ?? 0) + " mm";
  $("sUv").textContent = c.uv_index == null ? "—" : Math.round(c.uv_index);

  applyTheme(cond.group, isDay);
  renderHourly();
  renderDaily();
}

// find index of the hour nearest "now" in local time
function currentHourIndex(){
  const now = new Date(data.current.time);
  const target = now.toISOString().slice(0,13);
  const idx = data.hourly.time.findIndex(s => s.slice(0,13) === target);
  return idx < 0 ? 0 : idx;
}

function hourCard(i, markCurrent){
  const h = data.hourly;
  const cond = decode(h.weather_code[i], h.is_day[i] === 1);
  const time = new Date(h.time[i]).toLocaleTimeString(undefined,{hour:"numeric"});
  const pop = h.precipitation_probability?.[i];
  return `<div class="hour${markCurrent ? " current" : ""}">
      <div class="t">${markCurrent ? "Now" : time}</div>
      <div class="i">${cond.icon}</div>
      <div class="d">${t(h.temperature_2m[i])}</div>
      <div class="p">${pop == null ? "" : "💧" + pop + "%"}</div>
    </div>`;
}

function renderHourly(){
  const start = currentHourIndex();
  let html = "";
  for (let i = start; i < Math.min(start + 24, data.hourly.time.length); i++){
    html += hourCard(i, i === start);
  }
  $("hourly").innerHTML = html;
}

function renderDaily(){
  const d = data.daily;
  let html = "";
  for (let i = 0; i < Math.min(5, d.time.length); i++){
    const cond = decode(d.weather_code[i], true);
    const name = i === 0 ? "Today"
      : new Date(d.time[i]).toLocaleDateString(undefined,{weekday:"long"});
    const pop = d.precipitation_probability_max?.[i];
    html += `
      <button class="day" data-day="${i}" aria-expanded="${openDay === i}" aria-controls="panel-${i}">
        <span class="name">${name}</span>
        <span class="ico">${cond.icon}</span>
        <span class="hl">${t(d.temperature_2m_max[i])}<small>${t(d.temperature_2m_min[i])}</small></span>
        <span class="pop">${pop == null ? "" : "💧" + pop + "%"}</span>
      </button>
      <div class="day-panel${openDay === i ? " open" : ""}" id="panel-${i}">
        <div class="strip">${openDay === i ? dayHours(d.time[i]) : ""}</div>
      </div>`;
  }
  $("daily").innerHTML = html;
  $("daily").querySelectorAll(".day").forEach(btn => {
    btn.addEventListener("click", () => {
      const i = Number(btn.dataset.day);
      openDay = openDay === i ? -1 : i;
      renderDaily();
    });
  });
}

function dayHours(dateStr){
  let html = "";
  data.hourly.time.forEach((ts, i) => {
    if (ts.startsWith(dateStr) && i % 2 === 0) html += hourCard(i, false);
  });
  return html || '<div class="status">No hourly data.</div>';
}

/* ============================================================
   JS 6. EVENT HANDLERS
   ============================================================ */
const q = $("q"), suggest = $("suggest");

function closeSuggest(){ suggest.classList.remove("open"); q.setAttribute("aria-expanded","false"); }

const onType = debounce(async () => {
  const term = q.value.trim();
  if (term.length < 2){ closeSuggest(); return; }
  try{
    const results = await geocode(term);
    if (!results.length){
      suggest.innerHTML = '<button type="button" disabled>No matching city found</button>';
    } else {
      suggest.innerHTML = results.map((r, i) =>
        `<button type="button" role="option" data-i="${i}">${r.name}
          <small>${[r.admin1, r.country].filter(Boolean).join(", ")}</small></button>`).join("");
      suggest.querySelectorAll("button[data-i]").forEach(b => {
        b.addEventListener("click", () => {
          const r = results[Number(b.dataset.i)];
          q.value = r.name;
          closeSuggest();
          load(r);
        });
      });
    }
    suggest.classList.add("open");
    q.setAttribute("aria-expanded","true");
  }catch(err){
    closeSuggest();
    showStatus(navigator.onLine ? err.message : "You appear to be offline.", true);
  }
}, 320);

q.addEventListener("input", onType);
q.addEventListener("keydown", async e => {
  if (e.key === "Escape") closeSuggest();
  if (e.key === "Enter"){
    closeSuggest();
    const term = q.value.trim();
    if (!term) return;
    try{
      const r = await geocode(term);
      if (!r.length) return showStatus(`We couldn't find “${term}”. Try another spelling.`, true);
      load(r[0]);
    }catch(err){ showStatus(err.message, true); }
  }
});
document.addEventListener("click", e => { if (!suggest.contains(e.target) && e.target !== q) closeSuggest(); });

// Geolocation
$("geo").addEventListener("click", () => {
  if (!navigator.geolocation) return showStatus("Your browser doesn't support location access.", true);
  showStatus("Finding your location…");
  navigator.geolocation.getCurrentPosition(
    async pos => load(await reverseName(pos.coords.latitude, pos.coords.longitude)),
    err => showStatus(err.code === 1
      ? "Location permission denied. Search for a city instead."
      : "We couldn't get your location. Try searching for a city.", true),
    { timeout: 10000 }
  );
});

// Unit toggle
$("unit").addEventListener("click", () => {
  unit = unit === "C" ? "F" : "C";
  localStorage.setItem(UNIT_KEY, unit);
  $("uC").classList.toggle("on", unit === "C");
  $("uF").classList.toggle("on", unit === "F");
  if (data) render();
});
$("uC").classList.toggle("on", unit === "C");
$("uF").classList.toggle("on", unit === "F");

window.addEventListener("online", () => { if (place) load(place); });

/* ============================================================
   JS 7. BOOT — restore last city from localStorage
   ============================================================ */
(function init(){
  let saved = null;
  try{ saved = JSON.parse(localStorage.getItem(STORE_KEY) || "null"); }catch(_){}
  if (saved && saved.latitude != null){ q.value = saved.name; load(saved); }
  else { load({ name:"London", country:"United Kingdom", latitude:51.5072, longitude:-0.1276 }); }
})();
</script>
</body>
</html>
