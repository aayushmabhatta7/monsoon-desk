<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Monsoon Desk — Weather for India &amp; beyond</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Work+Sans:wght@400;500;700&display=swap" rel="stylesheet" />
<!-- Styles live in their own file -->
<link rel="stylesheet" href="weather.css" />
</head>
<body>
<div class="wrap">

  <!-- ===================== HTML STRUCTURE ===================== -->
  <header>
    <div class="masthead">
      <h1 class="brand">Monsoon <em>Desk</em></h1>
      <div class="kicker">Live weather · India &amp; worldwide</div>
    </div>
    <div class="tools">
      <div class="search">
        <label class="sr" for="q">Search city</label>
        <input id="q" type="search" placeholder="Search a city — Delhi, Pune, Guwahati…" autocomplete="off" role="combobox" aria-expanded="false" aria-controls="suggest" />
        <div id="suggest" class="suggest" role="listbox"></div>
      </div>
      <button id="geo" class="icon-btn" title="Use my location">📍 <span class="sr">Use my location</span></button>
      <button id="unit" class="icon-btn unit" title="Toggle units"><span id="uC" class="on">°C</span>/<span id="uF">°F</span></button>
    </div>
    <div class="chips" id="chips"><span class="label">Indian cities</span></div>
  </header>

  <div id="status" class="card status hidden"></div>

  <main id="app" class="hidden">
    <!-- Current weather -->
    <section class="card" aria-labelledby="nowTitle">
      <h2 id="nowTitle" class="sr">Current weather</h2>
      <div class="now">
        <div class="now-main">
          <div id="nowIcon" class="now-ico">☀️</div>
          <div>
            <div id="nowTemp" class="temp">--°</div>
            <div id="nowCond" class="meta">—</div>
          </div>
        </div>
        <div style="text-align:right">
          <div id="place" class="place">—</div>
          <div id="localTime" class="meta">—</div>
          <div id="dayNight" class="badge">🌞 Day</div>
        </div>
      </div>
      <div class="stats">
        <div class="stat"><span>Feels like</span><b id="sFeel">—</b></div>
        <div class="stat"><span>Humidity</span><b id="sHum">—</b></div>
        <div class="stat"><span>Wind</span><b id="sWind">—</b></div>
        <div class="stat"><span>Precipitation</span><b id="sPrec">—</b></div>
        <div class="stat"><span>UV index</span><b id="sUv">—</b></div>
      </div>
    </section>

    <!-- Hourly -->
    <section class="card">
      <h3>Next 24 hours</h3>
      <div id="hourly" class="strip"></div>
    </section>

    <!-- Daily -->
    <section class="card">
      <h3>5-day forecast</h3>
      <div id="daily" style="margin-top:12px"></div>
    </section>
  </main>

  <footer>Readings from Open-Meteo · clocks follow each city's local time</footer>
</div>

<!-- App logic lives in its own file -->
<script src="weather.js"></script>
</body>
</html>
